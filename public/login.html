<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Server View — Sign in</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="login-page">
  <div class="card login-card">
    <div class="sidebar-brand login-brand">
      <span class="brand-icon">&#9632;</span>
      <span class="brand-name">Server View</span>
    </div>
    <p class="muted">Sign in with the Google account allowed to access this dashboard.</p>
    <div id="googleBtn" class="google-btn-slot"></div>
    <p class="muted small" id="loginError"></p>
    <p class="muted small" id="configWarning"></p>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
