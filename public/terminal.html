<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Server View — Terminal</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">&#9632;</span>
      <span class="brand-name">Server View</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html"><span class="dot"></span>Overview</a>
      <a class="nav-item" href="containers.html"><span class="dot"></span>Docker Containers</a>
      <a class="nav-item active" href="terminal.html"><span class="dot"></span>Terminal</a>
      <a class="nav-item" href="settings.html"><span class="dot"></span>Settings</a>
    </nav>

    <div class="sidebar-stats" id="sidebarStats">
      <div class="qs-row"><span class="muted small">Uptime</span><strong id="qsUptime">—</strong></div>
      <div class="qs-row"><span class="muted small">CPU</span><strong id="qsCpu">—</strong></div>
      <div class="qs-row"><span class="muted small">Temp</span><strong id="qsTemp">—</strong></div>
      <div class="qs-row"><span class="muted small">RAM</span><strong id="qsRam">—</strong></div>
    </div>

    <div class="sidebar-footer">
      <div class="status-pill" id="connStatus"><span class="status-dot online"></span>Online</div>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div>
        <h1>Terminal</h1>
        <p class="muted">Direct shell access. Local network only — do not expose this page to the internet.</p>
      </div>
    </header>

    <div class="card terminal-card">
      <div id="terminal"></div>
    </div>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script src="js/terminal.js"></script>
</body>
</html>
