<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web Task Manager</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
<main class="content">
  <header class="topbar">
    <div>
      <h1>Web Task Manager</h1>
      <p class="muted"><span id="hostname">—</span> · <span id="platform">—</span></p>
    </div>
    <div class="topbar-right">
      <div class="uptime-box">
        <span class="muted">Uptime</span>
        <strong id="uptime">—</strong>
      </div>
      <div class="status-pill" id="connStatus"><span class="status-dot online"></span>Online</div>
      <span class="muted" id="userName">—</span>
      <button class="btn-icon" id="logoutBtn" title="Log out">&#9211;</button>
    </div>
  </header>

  <section class="tm-layout">
    <div class="tm-list" id="tmList"></div>

    <div class="tm-detail card" id="tmDetail">
      <div class="tm-detail-header">
        <h2 id="detailTitle">CPU</h2>
        <div class="tm-detail-actions" id="detailActions"></div>
      </div>
      <div id="detailBody"></div>
    </div>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
