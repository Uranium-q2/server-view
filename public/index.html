<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Server View</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">&#9632;</span>
      <span class="brand-name">Server View</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="#"><span class="dot"></span>Przegląd</a>
    </nav>
    <div class="sidebar-footer">
      <div class="status-pill" id="connStatus"><span class="status-dot online"></span>Online</div>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div>
        <h1 id="hostname">—</h1>
        <p id="platform" class="muted">—</p>
      </div>
      <div class="uptime-box">
        <span class="muted">Czas pracy</span>
        <strong id="uptime">—</strong>
      </div>
    </header>

    <section class="grid">
      <div class="card">
        <div class="card-header">
          <h2>CPU</h2>
          <span class="value" id="cpuLoadValue">0%</span>
        </div>
        <canvas id="cpuChart" height="90"></canvas>
        <div class="card-footer">
          <span id="cpuBrand" class="muted small">—</span>
          <span id="cpuCores" class="muted small">—</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Temperatura CPU</h2>
          <span class="value" id="tempValue">—°C</span>
        </div>
        <canvas id="tempChart" height="90"></canvas>
        <div class="card-footer">
          <span class="muted small">Maks. rdzeń: <span id="tempMax">—</span>°C</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Pamięć RAM</h2>
          <span class="value" id="memValue">0%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="memBar"></div></div>
        <div class="card-footer">
          <span class="muted small" id="memDetail">—</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Swap</h2>
          <span class="value" id="swapValue">0%</span>
        </div>
        <div class="bar"><div class="bar-fill alt" id="swapBar"></div></div>
        <div class="card-footer">
          <span class="muted small" id="swapDetail">—</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Sieć</h2>
        </div>
        <div class="net-rows">
          <div class="net-row"><span class="muted small">Pobieranie</span><strong id="netRx">0 KB/s</strong></div>
          <div class="net-row"><span class="muted small">Wysyłanie</span><strong id="netTx">0 KB/s</strong></div>
        </div>
      </div>

      <div class="card disks-card">
        <div class="card-header">
          <h2>Dyski</h2>
        </div>
        <div id="disksList" class="disks-list"></div>
      </div>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
