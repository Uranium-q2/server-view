<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Server View</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">&#9632;</span>
      <span class="brand-name">Server View</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="index.html"><span class="dot"></span>Overview</a>
      <a class="nav-item" href="containers.html"><span class="dot"></span>Docker Containers</a>
      <a class="nav-item" href="settings.html"><span class="dot"></span>Settings</a>
    </nav>

    <div class="sidebar-stats" id="sidebarStats">
      <div class="qs-row"><span class="muted small">Uptime</span><strong id="qsUptime">—</strong></div>
      <div class="qs-row"><span class="muted small">CPU</span><strong id="qsCpu">—</strong></div>
      <div class="qs-row"><span class="muted small">Temp</span><strong id="qsTemp">—</strong></div>
      <div class="qs-row"><span class="muted small">RAM</span><strong id="qsRam">—</strong></div>
    </div>

    <div class="sidebar-footer">
      <div class="user-box">
        <span class="email muted" id="userEmail">—</span>
        <button class="btn-icon" id="logoutBtn" title="Log out">&#9211;</button>
      </div>
      <div class="status-pill" id="connStatus"><span class="status-dot online"></span>Online</div>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div>
        <h1 id="hostname">—</h1>
        <p id="platform" class="muted">—</p>
      </div>
      <div class="uptime-box">
        <span class="muted">Uptime</span>
        <strong id="uptime">—</strong>
      </div>
    </header>

    <section class="grid">
      <div class="card">
        <div class="card-header">
          <h2>CPU</h2>
          <span class="value" id="cpuLoadValue">0%</span>
        </div>
        <canvas id="cpuChart" height="90"></canvas>
        <div class="card-footer">
          <span id="cpuBrand" class="muted small">—</span>
          <span id="cpuCores" class="muted small">—</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>CPU Temperature</h2>
          <span class="value" id="tempValue">—°C</span>
        </div>
        <canvas id="tempChart" height="90"></canvas>
        <div class="card-footer">
          <span class="muted small">Max core: <span id="tempMax">—</span>°C</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Memory</h2>
          <span class="value" id="memValue">0%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="memBar"></div></div>
        <div class="card-footer">
          <span class="muted small" id="memDetail">—</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Swap</h2>
          <span class="value" id="swapValue">0%</span>
        </div>
        <div class="bar"><div class="bar-fill alt" id="swapBar"></div></div>
        <div class="card-footer">
          <span class="muted small" id="swapDetail">—</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Network</h2>
        </div>
        <div class="net-rows">
          <div class="net-row"><span class="muted small">Download</span><strong id="netRx">0 KB/s</strong></div>
          <div class="net-row"><span class="muted small">Upload</span><strong id="netTx">0 KB/s</strong></div>
        </div>
      </div>

      <div class="card disks-card">
        <div class="card-header">
          <h2>Disks</h2>
        </div>
        <div id="disksList" class="disks-list"></div>
      </div>
    </section>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
