services:
  server-view:
    build: .
    container_name: server-view
    restart: unless-stopped
    ports:
      - "8642:8642"
    # privileged + pid: host let the container see real host stats (CPU/RAM/
    # temperature) and, via `nsenter` (lib/host-exec.js), run the Terminal
    # page and Docker container actions directly on the HOST instead of
    # inside this container. This effectively grants root-level access to
    # the host from the container - only run this on a trusted local
    # network, exactly as intended for this tool.
    privileged: true
    pid: host
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
