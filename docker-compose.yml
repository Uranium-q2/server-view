services:
  server-view:
    build: .
    container_name: server-view
    restart: unless-stopped
    ports:
      - "8642:8642"
    # uts: host makes the container report the HOST's real hostname (e.g.
    # "pwserver") instead of its own auto-generated container ID. /proc and
    # /sys are mounted read-only so the Overview page reads real host
    # CPU/RAM/temperature/fan data instead of the container's own (isolated,
    # meaningless) view of those.
    uts: host
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    # Passes the host's NVIDIA GPU through for the GPU tab (temperature/load/
    # VRAM via nvidia-smi). Requires the NVIDIA driver + NVIDIA Container
    # Toolkit installed on the host (see README) - without them this block
    # is simply ignored and the GPU tab stays hidden, same as before.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
